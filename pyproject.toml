[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "understanding-map"
version = "1.0.0"
description = "Controlled experiments on the blind spots of mean Average Precision in object detection."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Adam Tazi" }, { name = "Mohamed Glissa" }]
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.20",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pillow>=10.0",
    "pyarrow>=14.0",
    "pycocotools>=2.0.7",
    "tidecv>=1.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
notebook = ["ipykernel", "nbconvert"]

[project.scripts]
mapstudy = "mapstudy.cli:main"

[project.urls]
Repository = "https://github.com/devtazi/Understanding-mAP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["src/mapstudy/third_party", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
